name: Automatisch Weerbericht Herschrijven

# ------------------------------------------------------------------------------
# TRIGGER: Draait elke ochtend om 07:00 uur (UTC is 05:00 of 06:00 afhankelijk van zomertijd)
# En kan handmatig worden gestart via de 'Run workflow' knop.
# ------------------------------------------------------------------------------
on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC (In de winter 06:00 Nederlandse tijd, in de zomer 07:00)
  workflow_dispatch:

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
    # Stap 1: De code uit de repository ophalen
    - name: Checkout repository code
      uses: actions/checkout@v4

    # Stap 2: Python installeren op de GitHub server
    - name: Installeer Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.10'

    # Stap 3: De benodigde softwarepakketten installeren
    - name: Installeer benodigde packages
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 openai

    # Stap 4: Het script uitvoeren dat alles regelt
    - name: Start weerscraper en AI herschrijver
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        WP_JWT_TOKEN: ${{ secrets.WP_JWT_TOKEN }}
        WP_SITE_URL: "https://jouwwebsite.nl" # VERVANG DIT door jouw website URL
      run: |
        python - <<EOF
        import os
        import requests
        from bs4 import BeautifulSoup
        from openai import OpenAI

        # 1. NOS Weerbericht Scrapen
        try:
            response = requests.get("https://nos.nl", timeout=15)
            soup = BeautifulSoup(response.text, 'html.parser')
            # De selector zoekt naar het tekstblok van de weersverwachting
            weather_element = soup.find('p', class_='weather-description__text')
            nos_tekst = weather_element.text.strip() if weather_element else None
        except Exception as e:
            print(f"Fout bij het scrapen: {e}")
            nos_tekst = None

        if not nos_tekst:
            print("Geen weerbericht tekst gevonden op de NOS pagina.")
            exit(0)

        # 2. Herschrijven via OpenAI API
        client = OpenAI(api_key=os.environ.get("OPENAI_API_KEY"))
        
        prompt = (
            "Je bent een professionele weurredacteur. Herschrijf dit weerbericht in unieke, "
            "eigen woorden voor een website. Behoud alle meteorologische feiten, temperaturen, "
            "regio's en windrichtingen exact, maar zorg dat de zinsbouw en woordkeuze 100% "
            "plagiaatvrij en vlot leesbaar zijn. Geef alléén de herschreven tekst terug."
        )

        completion = client.chat.completions.create(
            model="gpt-4o",
            messages=[
                {"role": "system", "content": prompt},
                {"role": "user", "content": nos_tekst}
            ],
            temperature=0.7
        )
        nieuw_weerbericht = completion.choices[0].message.content.strip()

        # 3. Publiceren naar WordPress via REST API
        wp_url = f"{os.environ.get('WP_SITE_URL')}/wp-json/wp/v2/posts"
        headers = {
            "Authorization": f"Bearer {os.environ.get('WP_JWT_TOKEN')}",
            "Content-Type": "application/json"
        }
        payload = {
            "title": "Het weer van vandaag",
            "content": f"<!-- wp:paragraph --><p>{nieuw_weerbericht}</p><!-- /wp:paragraph -->",
            "status": "publish" # Verander naar 'draft' als je het eerst wilt controleren in WP
        }

        wp_response = requests.post(wp_url, json=payload, headers=headers)
        if wp_response.status_code == 201:
            print("Weerbericht succesvol gepubliceerd op de website!")
        else:
            print(f"Fout bij publiceren naar WP: {wp_response.status_code} - {wp_response.text}")
        EOF
