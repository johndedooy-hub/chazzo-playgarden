        # 1. Weersgegevens ophalen via de betrouwbare KNMI-API datafeed
        try:
            response = requests.get("https://knmi.nl", timeout=15)
            data = response.json()
            volledige_tekst = data.get("forecast", [{}]).get("narrative", "")
        except Exception as e:
            print(f"Fout bij ophalen bron: {e}")
            volledige_tekst = ""

        # 2. Breder zoeken met flexibele ankers (vóór en na de hoofdtekst)
        gefilterde_tekst = ""
        # We zoeken naar bekende startwoorden die de NOS gebruikt voor de dagelijkse plaatsing
        start_opties = ["Vandaag", "Overdag", "Vannacht", "Morgen"]
        
        start_index = -1
        for optie in start_opties:
            if optie in volledige_tekst:
                start_index = volledige_tekst.find(optie)
                break
        
        if start_index != -1:
            # Pak de tekst vanaf het gevonden startpunt en neem de hele alinea/blok mee
            gefilterde_tekst = volledige_tekst[start_index:].strip()
        else:
            # Volledige fallback als de specifieke ankers afwijken
            gefilterde_tekst = volledige_tekst.strip()

        if not gefilterde_tekst or len(gefilterde_tekst) < 10:
            print("Kon geen geschikt weerberichtblok isoleren met de ankers.")
            exit(1)
