name: Automatisch Weerbericht naar TXT

# ------------------------------------------------------------------------------
# TRIGGER: Draait elke ochtend om 07:00 uur Nederlandse tijd (05:00 of 06:00 UTC)
# En kan handmatig worden gestart via de 'Run workflow' knop in GitHub Actions.
# ------------------------------------------------------------------------------
on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC
  workflow_dispatch:

jobs:
  update-weather-file:
    runs-on: ubuntu-latest

    # Geef de workflow schrijfrechten om bestanden terug te pushen naar de repository
    permissions:
      contents: write

    steps:
    # Stap 1: De code uit de repository ophalen
    - name: Checkout repository code
      uses: actions/checkout@v4

    # Stap 2: Python installeren op de GitHub server
    - name: Installeer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Stap 3: De benodigde softwarepakketten installeren
    - name: Installeer benodigde packages
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 openai

    # Stap 4: Het script uitvoeren dat de tekst ophaalt, herschrijft en opslaat
    - name: Start weerscraper en genereer TXT
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python - <<EOF
        import os
        import requests
        from bs4 import BeautifulSoup
        from openai import OpenAI

        # 1. NOS Weerbericht Scrapen
        try:
            response = requests.get("https://nos.nl", timeout=15)
            soup = BeautifulSoup(response.text, 'html.parser')
            weather_element = soup.find('p', class_='weather-description__text')
            nos_tekst = weather_element.text.strip() if weather_element else None
        except Exception as e:
            print(f"Fout bij het scrapen: {e}")
            nos_tekst = None

        if not nos_tekst:
            print("Geen weerbericht tekst gevonden op de NOS pagina.")
            exit(1)

        # 2. Herschrijven via OpenAI API
        client = OpenAI(api_key=os.environ.get("OPENAI_API_KEY"))
        
        prompt = (
            "Je bent een professionele weurredacteur. Herschrijf dit weerbericht in unieke, "
            "eigen woorden. Behoud alle meteorologische feiten, temperaturen, regio's en "
            "windrichtingen exact, maar zorg dat de zinsbouw en woordkeuze 100% plagiaatvrij "
            "en vlot leesbaar zijn. Geef alleen de herschreven tekst terug zonder extra opmaak."
        )

        completion = client.chat.completions.create(
            model="gpt-4o",
            messages=[
                {"role": "system", "content": prompt},
                {"role": "user", "content": nos_tekst}
            ],
            temperature=0.7
        )
        nieuw_weerbericht = completion.choices.message.content.strip()

        # 3. Opslaan in de map 'main' als 'nosweer.txt'
        os.makedirs("main", exist_ok=True)
        with open("main/nosweer.txt", "w", encoding="utf-8") as f:
            f.write(nieuw_weerbericht)
        
        print("Het herschreven weerbericht is succesvol opgeslagen in main/nosweer.txt")
        EOF

    # Stap 5: Het nieuwe of aangepaste bestand automatisch committen en pushen naar GitHub
    - name: Commit en push wijzigingen
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        git add main/nosweer.txt
        
        # Alleen committen als er daadwerkelijk iets is veranderd in de tekst
        if git diff --staged --quiet; then
          echo "Geen wijzigingen in het weerbericht geconstateerd."
        else
          git commit -m "Automated update: nosweer.txt bijgewerkt"
          git push
        fi
        
