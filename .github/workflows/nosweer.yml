name: Automatisch Weerbericht naar TXT

on:
  schedule:
    - cron: '0 5 * * *' # Elke ochtend om 07:00 Nederlandse tijd (05:00 UTC)
  workflow_dispatch:

jobs:
  update-weather-file:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Installeer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installeer benodigde packages
      run: |
        python -m pip install --upgrade pip
        pip install requests openai

    - name: Haal tekst op via brede ankers en herschrijf
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python - <<EOF
        import os
        import requests
        from openai import OpenAI

        # 1. Weersgegevens ophalen via de betrouwbare KNMI-API datafeed
        try:
            response = requests.get("https://knmi.nl", timeout=15)
            data = response.json()
            volledige_tekst = data.get("forecast", [{}]).get("narrative", "")
        except Exception as e:
            print(f"Fout bij ophalen bron: {e}")
            volledige_tekst = ""

        if not volledige_tekst:
            print("Kon geen weersgegevens ophalen van de API.")
            exit(1)

        # 2. Breder zoeken met flexibele ankers (pakt tekst ervoor en erna)
        gefilterde_tekst = ""
        start_opties = ["Vandaag", "Overdag", "Vannacht", "Morgen"]
        
        start_index = -1
        for optie in start_opties:
            if optie in volledige_tekst:
                start_index = volledige_tekst.find(optie)
                break
        
        if start_index != -1:
            # Neem het hele blok vanaf het anker mee (inclusief omliggende zinnen)
            gefilterde_tekst = volledige_tekst[start_index:].strip()
        else:
            # Volledige fallback als de specifieke woorden afwijken
            gefilterde_tekst = volledige_tekst.strip()

        if len(gefilterde_tekst) < 10:
            print("Geen bruikbare tekst gevonden binnen de ankers.")
            exit(1)

        # 3. Foutloos herschrijven naar unieke zinnen via OpenAI (Nieuwe API-v2 structuur)
        client = OpenAI(api_key=os.environ.get("OPENAI_API_KEY"))
        
        prompt = (
            "Je bent een professionele weurredacteur. Herschrijf het aangeleverde weerberichtblok "
            "in volledig andere, correcte Nederlandse zinnen. Alle meteorologische feiten, temperaturen, "
            "regio's en windrichtingen moeten exact kloppen met de bron, maar de zinsbouw en woordkeuze "
            "moeten 100% uniek en plagiaatvrij zijn. Lever alléén de herschreven lopende tekst op, "
            "zonder inleiding, titels of aanhalingstekens."
        )

        completion = client.chat.completions.create(
            model="gpt-4o",
            messages=[
                {"role": "system", "content": prompt},
                {"role": "user", "content": gefilterde_tekst}
            ],
            temperature=0.6
        )
        nieuw_weerbericht = completion.choices.message.content.strip()

        # 4. Opslaan in de map 'main' als 'nosweer.txt'
        os.makedirs("main", exist_ok=True)
        with open("main/nosweer.txt", "w", encoding="utf-8") as f:
            f.write(nieuw_weerbericht)
        
        print("Het brede weerbericht is succesvol herschreven en opgeslagen!")
        EOF

    - name: Commit en push wijzigingen naar GitHub
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add main/nosweer.txt
        
        if git diff --staged --quiet; then
          echo "Geen wijzigingen in de weersituatie gevonden."
        else
          git commit -m "Automated update: nosweer.txt bijgewerkt via brede ankers"
          git push
        fi
        
