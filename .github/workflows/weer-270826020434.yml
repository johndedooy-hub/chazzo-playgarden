name: RSS Text to XTTSv2 WEER X1

on:
  workflow_dispatch:

jobs:
  process-text:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache TTS models
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/tts
            ~/.cache/faster_whisper
          key: tts-whisper-cache

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & FFmpeg
        run: |
          python -m pip install --upgrade pip
          python -m pip install torchcodec
          python -m pip install "transformers<4.40.0" "scipy<1.13.0" feedparser pydub mutagen requests python-dateutil TTS
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run TEXT pipeline
        env:
          RSS_URL: 'https://data.buienradar.nl/1.0/feed/xml/rssbuienradar'
          COVER_IMAGE: 'stationname.jpg'
          XTTS_SPEED: '1.50'
        run: |
          python3 - <<'EOF'
          import os
          import math
          import feedparser
          from pydub import AudioSegment, effects
          from mutagen.id3 import ID3, TIT2, TALB, APIC, ID3NoHeaderError

          # --- CPML TOS SKIP ---
          from TTS.utils.manage import ModelManager
          def _skip_tos(self, output_path):
              print("CPML TOS automatisch overgeslagen (CI).")
              return True
          ModelManager.ask_tos = _skip_tos

          # --- SAFE GLOBALS ---
          import torch
          from TTS.tts.configs.xtts_config import XttsConfig
          from TTS.tts.models.xtts import XttsAudioConfig, XttsArgs
          from TTS.config.shared_configs import BaseDatasetConfig

          torch.serialization.add_safe_globals([
              XttsConfig,
              XttsAudioConfig,
              XttsArgs,
              BaseDatasetConfig
          ])

          # --- RSS TEXT ONLY ---
          rss_url = os.environ["RSS_URL"]
          feed = feedparser.parse(rss_url)

          if not feed.entries:
              print("Geen items gevonden — workflow stopt netjes.")
              raise SystemExit(0)

          latest = feed.entries[0]

          # Pak de tekst uit de RSS feed
          text = ""
          if "summary" in latest:
              text = latest.summary.strip()
          elif "description" in latest:
              text = latest.description.strip()
          elif "title" in latest:
              text = latest.title.strip()

          if not text:
              print("Geen tekst gevonden in RSS — workflow stopt.")
              raise SystemExit(0)

          # Opslaan als weerbericht.txt
          with open("weerbericht.txt", "w", encoding="utf-8") as f:
              f.write(text)

          # --- XTTS ---
          from TTS.api import TTS
          tts = TTS("tts_models/multilingual/multi-dataset/xtts_v2")

          # Speaker schoonmaken
          speaker = AudioSegment.from_file("stem_voorbeeld.mp3")
          speaker = effects.normalize(speaker)
          speaker = speaker.low_pass_filter(9000)
          speaker = speaker.high_pass_filter(100)
          speaker.export("clean_speaker.wav", format="wav")

          speed = float(os.environ.get("XTTS_SPEED", "1.50"))

          # TTS naar raw.wav
          tts.tts_to_file(
              text=text,
              speaker_wav="clean_speaker.wav",
              language="nl",
              file_path="raw.wav",
              speed=speed
          )

          voice = AudioSegment.from_file("raw.wav")
          voice = effects.normalize(voice)

          # Newsbed overlay
          if os.path.exists("newsbed-1.mp3"):
              bed = AudioSegment.from_file("newsbed-1.mp3") - 20
              if len(bed) < len(voice):
                  bed *= math.ceil(len(voice) / len(bed))
              bed = bed[:len(voice)]
              final = bed.overlay(voice)
          else:
              final = voice

          final.export("weerbericht.mp3", format="mp3", bitrate="128k")

          # --- ID3 TAGS ---
          try:
              id3 = ID3("weerbericht.mp3")
          except ID3NoHeaderError:
              id3 = ID3()

          id3.add(TIT2(encoding=3, text="Weerbericht Update"))
          id3.add(TALB(encoding=3, text="Weerbericht Update"))

          cover = os.environ["COVER_IMAGE"]
          if os.path.exists(cover):
              with open(cover, "rb") as img:
                  id3.add(APIC(encoding=3, mime="image/jpeg", type=3, desc="Cover", data=img.read()))

          id3.save("weerbericht.mp3")

          EOF

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add weerbericht.mp3 weerbericht.txt || true
          git pull origin main --rebase || true
          git pull

          if git diff --cached --quiet; then
            echo "Geen wijzigingen om te committen."
          else
            git commit -m "WEER Update - UTC+2 $(date '+%H:%M')"
            git push
          fi
          
