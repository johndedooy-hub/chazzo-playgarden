name: Weerbericht Brabant — MaartenNeural preferred, faster, naturalized voice 7

on:
  workflow_dispatch:

jobs:
  generate-weather-and-tts:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      LATITUDE: "51.5"
      LONGITUDE: "5.0"
      TIMEZONE: "Europe/Amsterdam"
      OUTPUT_TXT: "weerbericht.txt"
      OUTPUT_MP3: "weerbericht.mp3"
      NEWSBED: "newsbed-1.mp3"
      SPEAKER_SAMPLE: "stem_voorbeeld.mp3"
      # User-preferred voice name
      TTS_MODEL_PREFERRED: "MaartenNeural"
      TTS_MODEL_FALLBACK: "tts_models/multilingual/multi-dataset/xtts_v2"
      # Slightly faster speech; tuned for clarity
      TTS_SPEED_MULTIPLIER: "1.90"
      MP3_BITRATE: "128k"
      BRANCH: "main"
      XDG_CACHE_HOME: "/home/runner/.cache"
      TORCH_HOME: "/home/runner/.cache/torch"
      TRANSFORMERS_CACHE: "/home/runner/.cache/huggingface"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages and pinned Python deps
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          # Pin transformers to a version compatible with many TTS releases
          python -m pip install --default-timeout=60 "transformers==4.29.2"
          # Install TTS and audio libs; include gTTS as robust fallback
          python -m pip install --default-timeout=60 requests pydub mutagen TTS gTTS

      - name: Build current weather text (detailed today & tomorrow, NL days, intro/outro, degrees only)
        run: |
          set -e
          python3 - <<'PY'
          import os, sys, datetime
          import requests

          LAT = os.environ.get("LATITUDE", "51.5")
          LON = os.environ.get("LONGITUDE", "5.0")
          TZ = os.environ.get("TIMEZONE", "Europe/Amsterdam")
          OUT = os.environ.get("OUTPUT_TXT", "weerbericht.txt")

          def fail(msg):
              print(msg)
              sys.exit(1)

          url = (
              "https://api.open-meteo.com/v1/forecast"
              f"?latitude={LAT}&longitude={LON}"
              "&hourly=temperature_2m,precipitation,weathercode,windspeed_10m"
              "&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weathercode"
              f"&timezone={TZ}"
          )

          try:
              r = requests.get(url, timeout=20)
              r.raise_for_status()
              data = r.json()
          except Exception as e:
              fail(f"Kon weerdata niet ophalen: {e}")

          wc_map = {
              0: "helder",1: "grotendeels zonnig",2: "wisselend bewolkt",3: "bewolkt",
              45: "mistig",48: "nevelig",51: "lichte motregen",53: "matige motregen",
              55: "dichte motregen",61: "lichte regen",63: "matige regen",65: "zware regen",
              71: "lichte sneeuw",73: "matige sneeuw",75: "zware sneeuw",80: "buien",
              81: "regelmatige buien",82: "zware buien",95: "onweersbuien",96: "onweersbuien met hagel",99: "zware onweersbuien met hagel"
          }

          # Translate English daynames to Dutch
          day_trans = {
              "Monday":"maandag","Tuesday":"dinsdag","Wednesday":"woensdag","Thursday":"donderdag",
              "Friday":"vrijdag","Saturday":"zaterdag","Sunday":"zondag"
          }

          daily = data.get("daily", {})
          dates = daily.get("time", [])
          temps_max = daily.get("temperature_2m_max", [])
          temps_min = daily.get("temperature_2m_min", [])
          precip_sum = daily.get("precipitation_sum", [])
          weathercodes = daily.get("weathercode", [])

          hourly = data.get("hourly", {})
          hourly_times = hourly.get("time", [])
          hourly_winds = hourly.get("windspeed_10m", [])
          hourly_precip = hourly.get("precipitation", [])
          hourly_temps = hourly.get("temperature_2m", [])

          if not dates:
              fail("Geen dagelijkse data beschikbaar van de weer-API.")

          def hourly_stats_for_date(date_str):
              max_wind = None
              total_prec = 0.0
              temps = []
              for i, t in enumerate(hourly_times):
                  if t.startswith(date_str):
                      if i < len(hourly_winds):
                          w = hourly_winds[i]
                          max_wind = w if (max_wind is None or w > max_wind) else max_wind
                      if i < len(hourly_precip):
                          total_prec += hourly_precip[i]
                      if i < len(hourly_temps):
                          temps.append(hourly_temps[i])
              avg_temp = sum(temps)/len(temps) if temps else None
              return max_wind, total_prec, avg_temp

          daily_entries = []
          for i, d in enumerate(dates):
              try:
                  date_obj = datetime.datetime.fromisoformat(d)
                  dayname = date_obj.strftime("%A")
                  dayname = day_trans.get(dayname, dayname)
              except Exception:
                  dayname = d
              wc = weathercodes[i] if i < len(weathercodes) else None
              wc_text = wc_map.get(wc, "wisselend weer") if wc is not None else "wisselend weer"
              tmin = temps_min[i] if i < len(temps_min) else None
              tmax = temps_max[i] if i < len(temps_max) else None
              prec = precip_sum[i] if i < len(precip_sum) else 0
              max_wind, hourly_prec, avg_temp = hourly_stats_for_date(d)
              daily_entries.append({
                  "date": d,
                  "dayname": dayname,
                  "wc_text": wc_text,
                  "tmin": tmin,
                  "tmax": tmax,
                  "prec": prec,
                  "max_wind": max_wind,
                  "hourly_prec": hourly_prec,
                  "avg_temp": avg_temp
              })

          today = daily_entries[0]
          tomorrow = daily_entries[1] if len(daily_entries) > 1 else None
          coming = daily_entries[2:6] if len(daily_entries) > 2 else []

          def fmt_deg(t):
              return f"{round(t)}°" if t is not None else "onbekend"

          # Build more detailed sentences for today and tomorrow
          today_parts = []
          today_parts.append(f"Vandaag in Noord-Brabant: {today['wc_text']}.")
          if today.get("avg_temp") is not None:
              today_parts.append(f"Temperatuur rond {fmt_deg(today['avg_temp'])}, met maxima tot {fmt_deg(today['tmax'])} en minima rond {fmt_deg(today['tmin'])}.")
          else:
              today_parts.append(f"Maxima {fmt_deg(today['tmax'])} en minima {fmt_deg(today['tmin'])}.")
          if today.get("hourly_prec", 0) > 0 or today.get("prec", 0) > 0:
              today_parts.append(f"Kans op neerslag: ongeveer {round(max(today.get('hourly_prec',0), today.get('prec',0)),1)} mm verspreid over de dag.")
          else:
              today_parts.append("Grote delen van de dag droog.")
          if today.get("max_wind") is not None:
              today_parts.append(f"Wind maximaal rond {round(today['max_wind'])} km/u.")
          today_sentence = " ".join(today_parts)

          tomorrow_sentence = ""
          if tomorrow:
              tparts = []
              tparts.append(f"Morgen: {tomorrow['wc_text']}.")
              if tomorrow.get("avg_temp") is not None:
                  tparts.append(f"Temperatuur rond {fmt_deg(tomorrow['avg_temp'])}, met maxima tot {fmt_deg(tomorrow['tmax'])}.")
              else:
                  tparts.append(f"Maxima {fmt_deg(tomorrow['tmax'])}.")
              if tomorrow.get("hourly_prec", 0) > 0 or tomorrow.get("prec", 0) > 0:
                  tparts.append(f"Kans op neerslag: ongeveer {round(max(tomorrow.get('hourly_prec',0), tomorrow.get('prec',0)),1)} mm; lokaal buien mogelijk.")
              else:
                  tparts.append("Grote delen van de dag droog.")
              if tomorrow.get("max_wind") is not None:
                  tparts.append(f"Wind maximaal rond {round(tomorrow['max_wind'])} km/u.")
              tomorrow_sentence = " ".join(tparts)

          coming_short = []
          for d in coming:
              coming_short.append(f"{d['dayname']}: {d['wc_text']}, {fmt_deg(d['tmax'])}")
          coming_sentence = ""
          if coming_short:
              coming_sentence = "Komende dagen: " + "; ".join(coming_short) + "."

          intro = "Dit is de weer update."
          outro = "Dit was de weer update."

          parts = [intro, today_sentence]
          if tomorrow_sentence:
              parts.append(tomorrow_sentence)
          if coming_sentence:
              parts.append(coming_sentence)
          parts.append(outro)

          final_text = " ".join(parts)
          final_text = " ".join(final_text.split())

          try:
              with open(OUT, "w", encoding="utf-8") as f:
                  f.write(final_text + "\n")
              print("Weerbericht geschreven naar", OUT)
          except Exception as e:
              fail(f"Kon niet schrijven naar {OUT}: {e}")
          PY

      - name: Generate speech (prefer MaartenNeural; force fallback to gTTS if Maarten not actually loaded), apply pitch -10Hz, naturalize audio, overlay newsbed
        run: |
          set -e
          python3 - <<'PY'
          import os, sys, math, subprocess, tempfile
          from pydub import AudioSegment, effects
          from mutagen.id3 import ID3, TIT2, TALB, ID3NoHeaderError

          OUT_TXT = os.environ.get("OUTPUT_TXT", "weerbericht.txt")
          OUT_MP3 = os.environ.get("OUTPUT_MP3", "weerbericht.mp3")
          NEWSBED = os.environ.get("NEWSBED", "newsbed-1.mp3")
          SPEAKER = os.environ.get("SPEAKER_SAMPLE", "stem_voorbeeld.mp3")
          PREFERRED = os.environ.get("TTS_MODEL_PREFERRED")
          FALLBACK = os.environ.get("TTS_MODEL_FALLBACK")
          SPEED = float(os.environ.get("TTS_SPEED_MULTIPLIER", "1.90"))
          BITRATE = os.environ.get("MP3_BITRATE", "128k")

          if not os.path.exists(OUT_TXT):
              print("Input text not found:", OUT_TXT)
              sys.exit(1)

          with open(OUT_TXT, "r", encoding="utf-8") as f:
              text = f.read().strip()
          if not text:
              print("Geen tekst in", OUT_TXT)
              sys.exit(1)

          raw_wav = "raw_weer.wav"
          processed_wav = "processed_weer.wav"
          used_engine = None

          # Pitch shift parameters
          PITCH_DOWN_HZ = 10.0
          BASE_PITCH_HZ = 220.0

          # Helper: run ffmpeg filter chain to naturalize voice (compress, slight reverb, EQ, small tempo tweak)
          def ffmpeg_naturalize(input_path, output_path):
              # Filters:
              # - acompressor: gentle dynamic range control
              # - aecho: subtle ambience
              # - equalizer: slight boost around 1200Hz for clarity
              # - atempo: small speed tweak (1.05) to reduce monotone feel
              filters = (
                  "acompressor=threshold=-20dB:ratio=3:attack=200:release=1000,"
                  "aecho=0.8:0.9:1000:0.02,"
                  "equalizer=f=1200:t=q:w=200:g=2,"
                  "atempo=1.05"
              )
              cmd = [
                  "ffmpeg", "-y", "-hide_banner", "-loglevel", "error",
                  "-i", input_path,
                  "-af", filters,
                  "-ar", "44100",
                  "-ac", "2",
                  output_path
              ]
              subprocess.check_call(cmd)

          # Try Coqui TTS with preferred model (MaartenNeural). If it loads a different model (e.g., Collette), force fallback.
          try:
              try:
                  from TTS.utils.manage import ModelManager
                  def _skip_tos(self, output_path):
                      print("CPML TOS automatisch geaccepteerd (CI).")
                      return True
                  ModelManager.ask_tos = _skip_tos
              except Exception:
                  pass

              from TTS.api import TTS
              tts_source = None
              try:
                  from TTS.utils.manage import ModelManager
                  manager = ModelManager()
                  try:
                      model_local, config_path, model_item = manager.download_model(PREFERRED)
                      tts_source = model_local or PREFERRED
                      print("Voorkeursmodel beschikbaar:", tts_source)
                  except Exception as e:
                      print("Voorkeursmodel niet beschikbaar via manager:", e)
                      tts_source = PREFERRED
              except Exception:
                  tts_source = PREFERRED

              print("Probeer TTS met bron:", tts_source)
              tts = TTS(tts_source)

              # If the loaded source string does not contain the preferred voice name, treat as failure to ensure correct voice
              loaded_id = str(tts_source).lower() if tts_source else ""
              if PREFERRED.lower() not in loaded_id and "maarten" not in loaded_id:
                  raise RuntimeError(f"Voorkeursstem niet geladen (gevonden: {loaded_id}). Forceren fallback.")

              # Prepare speaker wav (use provided sample or silent fallback)
              speaker_wav = "clean_speaker.wav"
              if os.path.exists(SPEAKER):
                  try:
                      sp = AudioSegment.from_file(SPEAKER)
                      sp = effects.normalize(sp)
                      sp = sp.low_pass_filter(9000)
                      sp = sp.high_pass_filter(100)
                      sp.export(speaker_wav, format="wav")
                  except Exception as e:
                      print("Waarschuwing bij verwerken speaker sample, maak stille fallback:", e)
                      AudioSegment.silent(duration=1000).export(speaker_wav, format="wav")
              else:
                  AudioSegment.silent(duration=1000).export(speaker_wav, format="wav")

              # Generate TTS to raw wav
              try:
                  tts.tts_to_file(
                      text=text,
                      speaker_wav=speaker_wav,
                      language="nl",
                      file_path=raw_wav,
                      speed=SPEED
                  )
              except TypeError:
                  tts.tts_to_file(
                      text=text,
                      language="nl",
                      file_path=raw_wav,
                      speed=SPEED
                  )

              if not os.path.exists(raw_wav):
                  raise RuntimeError("TTS engine rapporteerde geen outputbestand.")
              used_engine = "coqui (Maarten preferred)"
              print("TTS via Coqui voltooid met voorkeursstem.")
          except Exception as e:
              print("Coqui TTS faalde of voorkeursstem niet geladen:", e)
              print("Fallback: gebruik gTTS (online Google TTS).")
              try:
                  from gtts import gTTS
                  tts = gTTS(text, lang="nl")
                  tts.save(raw_wav)
                  used_engine = "gTTS"
                  print("gTTS fallback voltooid.")
              except Exception as e2:
                  print("gTTS fallback faalde:", e2)
                  sys.exit(1)

          # Load voice
          try:
              voice = AudioSegment.from_file(raw_wav)
          except Exception as e:
              print("Fout bij laden raw wav:", e)
              sys.exit(1)

          # Apply pitch shift: lower by ~10 Hz using resampling heuristic
          try:
              base = BASE_PITCH_HZ = 220.0
              down = PITCH_DOWN_HZ = 10.0
              factor = (base - down) / base
              if factor <= 0:
                  factor = 0.98
              new_rate = int(voice.frame_rate * factor)
              pitched = voice._spawn(voice.raw_data, overrides={"frame_rate": new_rate})
              pitched = pitched.set_frame_rate(voice.frame_rate)
              voice = pitched
              print(f"Pitch aangepast: ongeveer -{int(down)}Hz (factor {factor:.4f}).")
          except Exception as e:
              print("Waarschuwing bij pitch shift:", e)

          # Normalize and export intermediate wav for ffmpeg processing
          try:
              voice = effects.normalize(voice)
              voice.export(processed_wav, format="wav")
          except Exception as e:
              print("Fout bij export voor processing:", e)
              sys.exit(1)

          # Run ffmpeg naturalization (compressor, subtle reverb, EQ, slight tempo tweak) to reduce monotone feel
          try:
              ffmpeg_naturalize(processed_wav, processed_wav + ".ff")
              final_source = processed_wav + ".ff"
          except Exception as e:
              print("Waarschuwing: ffmpeg naturalize faalde, gebruik ongefilterde audio:", e)
              final_source = processed_wav

          # Overlay newsbed if present
          try:
              voice_final = AudioSegment.from_file(final_source)
              if os.path.exists(NEWSBED):
                  bed = AudioSegment.from_file(NEWSBED) - 18
                  if len(bed) < len(voice_final) and len(bed) > 0:
                      repeat = math.ceil(len(voice_final) / len(bed))
                      bed = bed * repeat
                  bed = bed[:len(voice_final)]
                  combined = bed.overlay(voice_final)
              else:
                  combined = voice_final
              combined.export(OUT_MP3, format="mp3", bitrate=BITRATE)
          except Exception as e:
              print("Fout bij overlay/export:", e)
              sys.exit(1)

          # Add simple ID3 tags
          try:
              try:
                  id3 = ID3(OUT_MP3)
              except ID3NoHeaderError:
                  id3 = ID3()
              id3.add(TIT2(encoding=3, text="Weerbericht Brabant"))
              id3.add(TALB(encoding=3, text="Weerbericht Brabant"))
              id3.save(OUT_MP3)
          except Exception:
              pass

          print("TTS generatie voltooid:", OUT_MP3, " (engine:", used_engine, ")")
          PY

      - name: Commit and push generated files (always)
        env:
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          set -e
          git config --local user.email "$GIT_COMMITTER_EMAIL"
          git config --local user.name "$GIT_COMMITTER_NAME"

          git checkout -B "$BRANCH"

          git add -A "${OUTPUT_TXT}" "${OUTPUT_MP3}" || true

          if git diff --staged --quiet; then
            git commit --allow-empty -m "Weerbericht update (manual run) - $(date -u '+%Y-%m-%d %H:%M UTC')"
          else
            git commit -m "Weerbericht update (manual run) - $(date -u '+%Y-%m-%d %H:%M UTC')"
          fi

          git push --set-upstream origin "$BRANCH" --force-with-lease

      - name: Final status
        run: |
          echo "Workflow voltooid. Bestand(en): ${OUTPUT_TXT}, ${OUTPUT_MP3}"
          
