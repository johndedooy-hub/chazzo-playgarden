name: Fetch OmroepBrabant Weer Update 1

on:
  workflow_dispatch:

jobs:
  fetch-weather:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install --default-timeout=60 requests beautifulsoup4 lxml

      - name: Fetch and extract weather text
        env:
          TARGET_URL: 'https://www.omroepbrabant.nl/weer'
          OUTPUT_FILE: 'omroepbrabant_weer.txt'
        run: |
          set -e
          python3 - <<'PY'
          import os, sys, time
          import requests
          from bs4 import BeautifulSoup

          def fail(msg):
              print(msg)
              sys.exit(1)

          url = os.environ.get("TARGET_URL")
          out_file = os.environ.get("OUTPUT_FILE", "omroepbrabant_weer.txt")

          if not url:
              fail("TARGET_URL niet ingesteld")

          # retry logic voor netwerkfluctuaties
          session = requests.Session()
          retries = 3
          backoff = 5
          resp = None
          for i in range(retries):
              try:
                  resp = session.get(url, timeout=30, headers={"User-Agent":"Mozilla/5.0 (compatible; fetch-bot/1.0)"})
                  resp.raise_for_status()
                  break
              except Exception as e:
                  print(f"Download poging {i+1} mislukt: {e}")
                  if i < retries - 1:
                      time.sleep(backoff * (i+1))
                  else:
                      fail(f"Kon pagina niet downloaden: {e}")

          html = resp.text

          soup = BeautifulSoup(html, "lxml")

          # 1) Probeer herkenbare selectors (meest specifiek)
          selectors = [
              "article.weer", "div.weer", "div#weer", "section.weer", "section#weer",
              "article", "main", "div#content", "div.content", "div.article"
          ]

          text = None

          for sel in selectors:
              el = soup.select_one(sel)
              if el:
                  # verwijder scripts, styles en navigatie
                  for bad in el.select("script, style, .share, .breadcrumb, nav, .advertisement"):
                      bad.decompose()
                  candidate = el.get_text(separator="\n", strip=True)
                  if candidate and len(candidate) > 20:
                      text = candidate
                      print(f"Gevonden met selector: {sel}")
                      break

          # 2) fallback: zoek naar grootste tekstblok binnen main/article
          if not text:
              candidates = []
              for tag in soup.select("main, article, #content, .content"):
                  if tag:
                      for bad in tag.select("script, style, .share, nav, .breadcrumb, .advertisement"):
                          bad.decompose()
                      t = tag.get_text(separator="\n", strip=True)
                      candidates.append((len(t), t))
              if candidates:
                  candidates.sort(reverse=True)
                  text = candidates[0][1]
                  print("Gevonden via grootste content fallback.")

          # 3) laatste redmiddel: hele pagina tekst (zonder scripts/styles)
          if not text:
              for bad in soup.select("script, style"):
                  bad.decompose()
              text = soup.get_text(separator="\n", strip=True)
              print("Gevonden via volledige paginatekst fallback.")

          # Extra cleanup: verwijder meerdere lege regels en trim
          lines = [line.strip() for line in text.splitlines() if line.strip()]
          cleaned = "\n".join(lines)

          # Schrijf naar bestand
          try:
              with open(out_file, "w", encoding="utf-8") as f:
                  f.write(cleaned)
              print(f"Weather text opgeslagen in {out_file}")
          except Exception as e:
              fail(f"Kon niet schrijven naar {out_file}: {e}")

          PY

      - name: Commit and push if changed
        run: |
          set -e
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add omroepbrabant_weer.txt || true
          git pull origin main --rebase || true

          if git diff --cached --quiet; then
            echo "Geen wijzigingen om te committen."
          else
            git commit -m "Manual update: OmroepBrabant weer - $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
