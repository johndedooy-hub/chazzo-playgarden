name: RSS Text to XTTSv2 WEER X4

on:
  workflow_dispatch:

jobs:
  process-text:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache TTS models
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/tts
            ~/.cache/faster_whisper
          key: tts-whisper-cache

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & FFmpeg
        run: |
          python -m pip install --upgrade pip
          python -m pip install torchcodec
          python -m pip install "transformers<4.40.0" "scipy<1.13.0" feedparser pydub mutagen requests python-dateutil TTS
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run TEXT pipeline
        env:
          RSS_URL: 'https://www.bd.nl/binnenland/rss.xml'
          COVER_IMAGE: 'weerbericht.jpg'

          # Iets sneller spreken
          XTTS_SPEED: '1.70'

          # Pitch 5% lager
          PITCH_FACTOR: '0.85'

        run: |
          python3 - <<'EOF'
          import os
          import math
          import re
          import html
          import subprocess
          import feedparser

          from html.parser import HTMLParser
          from pydub import AudioSegment, effects
          from mutagen.id3 import ID3, TIT2, TALB, APIC, ID3NoHeaderError


          # ============================================================
          # HTML / SPAN TAGS VERWIJDEREN
          # ============================================================

          class HTMLTextExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []

              def handle_data(self, data):
                  self.parts.append(data)

              def get_text(self):
                  return " ".join(self.parts)


          def clean_rss_text(text):
              if not text:
                  return ""

              # HTML entities omzetten
              text = html.unescape(text)

              # HTML tags verwijderen
              parser = HTMLTextExtractor()
              parser.feed(text)
              text = parser.get_text()

              # Eventuele resterende tags verwijderen
              text = re.sub(r"<[^>]+>", " ", text)

              # Overbodige whitespace verwijderen
              text = re.sub(r"\s+", " ", text)

              return text.strip()


          # ============================================================
          # CPML TOS SKIP
          # ============================================================

          from TTS.utils.manage import ModelManager

          def _skip_tos(self, output_path):
              print("CPML TOS automatisch overgeslagen (CI).")
              return True

          ModelManager.ask_tos = _skip_tos


          # ============================================================
          # SAFE GLOBALS
          # ============================================================

          import torch

          from TTS.tts.configs.xtts_config import XttsConfig
          from TTS.tts.models.xtts import XttsAudioConfig, XttsArgs
          from TTS.config.shared_configs import BaseDatasetConfig

          torch.serialization.add_safe_globals([
              XttsConfig,
              XttsAudioConfig,
              XttsArgs,
              BaseDatasetConfig
          ])


          # ============================================================
          # RSS TEXT ONLY
          # ============================================================

          rss_url = os.environ["RSS_URL"]
          feed = feedparser.parse(rss_url)

          if not feed.entries:
              print("Geen items gevonden — workflow stopt netjes.")
              raise SystemExit(0)

          latest = feed.entries[0]

          # Tekst uit RSS halen
          text = ""

          if "summary" in latest and latest.summary:
              text = latest.summary.strip()

          elif "description" in latest and latest.description:
              text = latest.description.strip()

          elif "title" in latest and latest.title:
              text = latest.title.strip()


          if not text:
              print("Geen tekst gevonden in RSS — workflow stopt.")
              raise SystemExit(0)


          # ============================================================
          # HTML / SPAN / OPMAAK UIT RSS VERWIJDEREN
          # ============================================================

          text = clean_rss_text(text)

          if not text:
              print("Na verwijderen van HTML-tags bleef geen tekst over.")
              raise SystemExit(0)

          print("Schone RSS-tekst:")
          print(text)


          # ============================================================
          # OPSLAAN ALS WEERBERICHT.TXT
          # ============================================================

          with open("weerbericht.txt", "w", encoding="utf-8") as f:
              f.write(text)


          # ============================================================
          # XTTS
          # ============================================================

          from TTS.api import TTS

          tts = TTS(
              "tts_models/multilingual/multi-dataset/xtts_v2"
          )


          # ============================================================
          # SPEAKER SCHOONMAKEN
          # ============================================================

          speaker = AudioSegment.from_file("stem_voorbeeld.mp3")

          speaker = effects.normalize(speaker)
          speaker = speaker.low_pass_filter(9000)
          speaker = speaker.high_pass_filter(100)

          speaker.export(
              "clean_speaker.wav",
              format="wav"
          )


          # ============================================================
          # SPRAAKTEMPO
          # ============================================================

          speed = float(
              os.environ.get("XTTS_SPEED", "1.70")
          )


          # ============================================================
          # TTS NAAR RAW.WAV
          # ============================================================

          tts.tts_to_file(
              text=text,
              speaker_wav="clean_speaker.wav",
              language="nl",
              file_path="raw.wav",
              speed=speed
          )


          # ============================================================
          # STEM IETS LAGER MAKEN
          #
          # PITCH_FACTOR 0.90 = ongeveer 7% lager.
          # Het tempo blijft hierbij vrijwel gelijk.
          # ============================================================

          pitch_factor = float(
              os.environ.get("PITCH_FACTOR", "0.85")
          )

          pitch_output = "voice_pitched.wav"

          # Sample rate van het originele bestand uitlezen
          probe = subprocess.run(
              [
                  "ffprobe",
                  "-v",
                  "error",
                  "-select_streams",
                  "a:0",
                  "-show_entries",
                  "stream=sample_rate",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  "raw.wav"
              ],
              capture_output=True,
              text=True
          )

          sample_rate = int(probe.stdout.strip())

          # Pitch omlaag zonder het tempo merkbaar te veranderen
          new_rate = int(sample_rate * pitch_factor)

          tempo_correction = 1.10 / pitch_factor

          subprocess.run(
              [
                  "ffmpeg",
                  "-y",
                  "-i",
                  "raw.wav",
                  "-filter:a",
                  f"asetrate={new_rate},"
                  f"aresample={sample_rate},"
                  f"atempo={tempo_correction}",
                  pitch_output
              ],
              check=True
          )


          # ============================================================
          # VOICE NORMALIZEN
          # ============================================================

          voice = AudioSegment.from_file(pitch_output)

          voice = effects.normalize(voice)


          # ============================================================
          # NEWSBED OVERLAY
          # ============================================================

          if os.path.exists("weer-bed-1.mp3"):

              bed = AudioSegment.from_file(
                  "weer-bed-1.mp3"
              ) - 20

              if len(bed) < len(voice):
                  bed *= math.ceil(
                      len(voice) / len(bed)
                  )

              bed = bed[:len(voice)]

              final = bed.overlay(voice)

          else:
              final = voice


          # ============================================================
          # MP3 EXPORT
          # ============================================================

          final.export(
              "weerbericht.mp3",
              format="mp3",
              bitrate="128k"
          )


          # ============================================================
          # ID3 TAGS
          # ============================================================

          try:
              id3 = ID3("weerbericht.mp3")

          except ID3NoHeaderError:
              id3 = ID3()


          id3.add(
              TIT2(
                  encoding=3,
                  text="Weerbericht Update"
              )
          )

          id3.add(
              TALB(
                  encoding=3,
                  text="Weerbericht Update"
              )
          )


          # ============================================================
          # COVER IMAGE
          # ============================================================

          cover = os.environ["COVER_IMAGE"]

          if os.path.exists(cover):

              with open(cover, "rb") as img:

                  id3.add(
                      APIC(
                          encoding=3,
                          mime="image/jpeg",
                          type=3,
                          desc="Cover",
                          data=img.read()
                      )
                  )


          id3.save("weerbericht.mp3")

          print("Weerbericht succesvol aangemaakt.")
          print("XTTS snelheid:", speed)
          print("Pitch factor:", pitch_factor)

          EOF


      # ================================================================
      # COMMIT EN PUSH
      # ================================================================

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add weerbericht.mp3 weerbericht.txt || true

          git pull origin main --rebase || true
          git pull

          if git diff --cached --quiet; then
            echo "Geen wijzigingen om te committen."
          else
            git commit -m "WEER Update - UTC+2 $(date '+%H:%M')"
            git push
          fi
          
