name: Drive TXT to XTTSv2 FAST 11

on:
  workflow_dispatch:

jobs:
  process-audio:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache TTS models
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/tts
          key: tts-cache

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydub mutagen requests TTS
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run FAST pipeline
        env:
          DRIVE_TXT_URL: 'https://drive.google.com/uc?export=download&id=1FMLqmvQrtd7hYb_YNV9zI3-GNLvYr-6Z'
          COVER_IMAGE: 'stationname.jpg'
          XTTS_SPEED: '1.50'
        run: |
          python3 - <<'EOF'
          import os
          import requests
          from datetime import datetime
          from pydub import AudioSegment, effects
          from mutagen.id3 import ID3, TIT2, TALB, APIC, ID3NoHeaderError

          # --- DOWNLOAD TXT ---
          url = os.environ["DRIVE_TXT_URL"]
          txt_data = requests.get(url).text.strip()

          if not txt_data:
              print("TXT bestand is leeg — workflow stopt.")
              raise SystemExit(0)

          # --- ZINNEN OPSCHONEN ---
          import re
          sentences = re.split(r'(?<=[.!?])\s+', txt_data)
          sentences = [s.strip() for s in sentences if s.strip()]

          if len(sentences) > 2:
              sentences = sentences[1:-1]

          cleaned_txt = " ".join(sentences).strip()

          # --- INTRO / OUTRO ---
          hour = datetime.utcnow().hour + 2
          greet = "Goedemorgen" if hour < 12 else "Goedendag" if hour < 18 else "Goedenavond"

          intro = f"{greet}, dit is het Ultra Radio Nieuws, ik ben Johan de Vries."
          outro = "Dat was het weer, terug naar de muziek op Ultra Radio!"

          transcript = f"{intro} {cleaned_txt} {outro}"

          # --- TXT OPSLAAN ---
          with open("stationname.txt", "w", encoding="utf-8") as f:
              f.write(transcript)

