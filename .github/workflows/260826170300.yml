name: Drive TXT to XTTSv2 FAST 10

on:
  workflow_dispatch:

jobs:
  process-audio:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache TTS models
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/tts
            ~/.cache/faster_whisper
          key: tts-whisper-cache

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & FFmpeg
        run: |
          python -m pip install --upgrade pip
          python -m pip install torchcodec
          python -m pip install "transformers<4.40.0" "scipy<1.13.0" pydub mutagen requests python-dateutil TTS
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run FAST pipeline
        env:
          DRIVE_TXT_URL: 'https://drive.google.com/uc?export=download&id=1FMLqmvQrtd7hYb_YNV9zI3-GNLvYr-6Z'
          COVER_IMAGE: 'stationname.jpg'
          XTTS_SPEED: '1.50'
        run: |
          python3 - <<'EOF'
          import os
          import requests
          from datetime import datetime
          from pydub import AudioSegment, effects
          from mutagen.id3 import ID3, TIT2, TALB, APIC, ID3NoHeaderError

          # --- CPML TOS SKIP ---
          from TTS.utils.manage import ModelManager
          def _skip_tos(self, output_path):
              print("CPML TOS automatisch overgeslagen (CI).")
              return True
          ModelManager.ask_tos = _skip_tos

          # --- SAFE GLOBALS ---
          import torch
          from TTS.tts.configs.xtts_config import XttsConfig
          from TTS.tts.models.xtts import XttsAudioConfig, XttsArgs
          from TTS.config.shared_configs import BaseDatasetConfig

          torch.serialization.add_safe_globals([
              XttsConfig,
              XttsAudioConfig,
              XttsArgs,
              BaseDatasetConfig
          ])

          # --- DOWNLOAD TXT VAN GOOGLE DRIVE ---
          url = os.environ["DRIVE_TXT_URL"]
          txt_data = requests.get(url).text.strip()

          if not txt_data:
              print("TXT bestand is leeg — workflow stopt netjes.")
              raise SystemExit(0)

          # --- SPLIT IN ZINNEN ---
          # We splitsen op punt, uitroepteken of vraagteken
          import re
          sentences = re.split(r'(?<=[.!?])\s+', txt_data)
          sentences = [s.strip() for s in sentences if s.strip()]

          # --- VERWIJDER EERSTE EN LAATSTE ZIN ---
          if len(sentences) > 2:
              sentences = sentences[1:-1]

          # Combineer terug naar één tekst
          cleaned_txt = " ".join(sentences).strip()

          # --- DYNAMISCHE INTRO ---
          hour = datetime.utcnow().hour + 2  # UTC+2
          if hour < 12:
              greet = "Goedemorgen"
          elif hour < 18:
              greet = "Goedendag"
          else:
              greet = "Goedenavond"

          intro = f"{greet}, dit is het Ultra Radio Nieuws, ik ben Johan de Vries."

          # --- OUTRO ---
          outro = "Dat was het weer, terug naar de muziek op Ultra Radio!"

          # --- VOLLEDIGE TEKST ---
          transcript = f"{intro} {cleaned_txt} {outro}"

          # --- TXT OPSLAAN ---
          with open("stationname.txt", "w", encoding="utf-8") as f:
              f.write(transcript)

          # --- XTTS ---
          from TTS.api import TTS
          tts = TTS("tts_models/multilingual/multi-dataset/xtts_v2")

          speaker = AudioSegment.from_file("stem_voorbeeld.mp3")
          speaker = effects.normalize(speaker)
          speaker = speaker.low_pass_filter(9000)
          speaker = speaker.high_pass_filter(100)
          speaker.export("clean_speaker.wav", format="wav")

          speed = float(os.environ.get("XTTS_SPEED", "1.50"))

          tts.tts_to_file(
              text=transcript,
              speaker_wav="clean_speaker.wav",
              language="nl",
              file_path="raw.wav",
              speed=speed
          )

          voice = AudioSegment.from_file("raw.wav")
          voice = effects.normalize(voice)

          if os.path.exists("newsbed-1.mp3"):
              bed = AudioSegment.from_file("newsbed-1.mp3") - 20
              if len(bed) < len(voice):
                  bed *= math.ceil(len(voice) / len(bed))
              bed = bed[:len(voice)]
              final = bed.overlay(voice)
          else:
              final = voice

          final.export("stationname.mp3", format="mp3", bitrate="128k")

          try:
              id3 = ID3("stationname.mp3")
          except ID3NoHeaderError:
              id3 = ID3()

          id3.add(TIT2(encoding=3, text="Ultra Radio Nieuws Update"))
          id3.add(TALB(encoding=3, text="Ultra Radio Nieuws Update"))

          cover = os.environ["COVER_IMAGE"]
          if os.path.exists(cover):
              with open(cover, "rb") as img:
                  id3.add(APIC(encoding=3, mime="image/jpeg", type=3, desc="Cover", data=img.read()))

          id3.save("stationname.mp3")

          EOF

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add stationname.mp3 stationname.txt || true
          git pull origin main --rebase || true
          git pull

          if git diff --cached --quiet; then
            echo "Geen wijzigingen om te committen."
          else
            git commit -m "FAST Update: Ultra Radio Nieuws - UTC+2 $(date '+%H:%M')"
            git push
          fi
          
