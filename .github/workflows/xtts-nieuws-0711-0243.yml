name: RSS to Text to XTTSv2 FAST

on:
  workflow_dispatch:
    inputs:
      forceer:
        description: 'Ook draaien als er geen nieuwe aflevering is (voor testen)'
        type: boolean
        default: false

# nooit twee runs tegelijk (voorkomt botsende commits)
concurrency:
  group: nieuws
  cancel-in-progress: false

jobs:
  process-audio:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---------- Snelle check: is er een nieuwe aflevering? (seconden) ----------
      - name: Check nieuwe aflevering
        id: check
        env:
          RSS_URL: 'https://www.omnycontent.com/d/playlist/8257a063-6be9-42fa-b892-acd4013b1255/84d4de9f-8ca2-40c5-8d33-b0ce00d6f186/e4c79cb6-51a3-4c08-9573-b0ce00d746db/podcast.rss'
          FORCEER: ${{ inputs.forceer }}
        run: |
          python -m pip install --quiet feedparser
          python3 - <<'EOF'
          import os, feedparser

          rss_url = os.environ["RSS_URL"]
          forceer = os.environ.get("FORCEER", "false").lower() == "true"

          def uitvoer(waarde):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"nieuw={waarde}\n")

          feed = feedparser.parse(rss_url)
          if not feed.entries:
              print("Geen afleveringen gevonden - workflow stopt netjes.")
              uitvoer("false")
              raise SystemExit(0)

          latest = feed.entries[0]
          audio_url = None
          for enclosure in latest.get("enclosures", []):
              if (enclosure.get("type") or "").startswith("audio/"):
                  audio_url = enclosure.get("href")
                  break
          if not audio_url:
              print("Geen audio gevonden - workflow stopt netjes.")
              uitvoer("false")
              raise SystemExit(0)

          nieuw_id = latest.get("id") or latest.get("guid") or audio_url
          with open("nieuw-id.tmp", "w", encoding="utf-8") as f:
              f.write(nieuw_id)
          with open("nieuw-audio-url.tmp", "w", encoding="utf-8") as f:
              f.write(audio_url)

          oud_id = ""
          if os.path.exists("nieuws-laatste-id.txt"):
              oud_id = open("nieuws-laatste-id.txt", encoding="utf-8").read().strip()

          if nieuw_id == oud_id and not forceer:
              print("Zelfde aflevering als vorige keer - niets te doen.")
              uitvoer("false")
          else:
              print("Nieuwe aflevering gevonden:", nieuw_id)
              uitvoer("true")
          EOF

      # ---------- Alles hieronder alleen als er echt iets nieuws is ----------
      - name: Cache TTS models
        if: steps.check.outputs.nieuw == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/tts
            ~/.cache/tts
            ~/.cache/huggingface
            ~/.cache/pip
          key: tts-whisper-cache-v2

      - name: Install dependencies & FFmpeg
        if: steps.check.outputs.nieuw == 'true'
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install --default-timeout=60 torchcodec
          python -m pip install --default-timeout=60 "transformers<4.40.0" "scipy<1.13.0" feedparser pydub mutagen requests python-dateutil faster-whisper TTS
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Run FAST pipeline
        if: steps.check.outputs.nieuw == 'true'
        env:
          OUTPUT_NAAM: 'stationname'
          COVER_IMAGE: 'stationname.jpg'
          SPEAKER_FILE: 'stem-voorbeeld.mp3'
          SPEAKER_MAX_SECONDS: '20'
          BED_FILE: 'newsbed-1.mp3'
          WHISPER_MODEL: 'small'
          # Gesproken zinnen: INTRO komt voor het nieuws, OUTRO erna (leeg laten = niets). De eerste en laatste zin van de bron worden weggehaald.
          INTRO: 'Welkom, ik ben Lindo Storm.'
          OUTRO: 'Op focus fantastiek.'
          # SNELHEID: XTTS_SPEED = tempo waarop de stem gemaakt wordt (rustig = schoner)
          #           TEMPO_NA   = daarna versnellen met ffmpeg (totaal 1.00 x 1.10 = 1.1)
          XTTS_SPEED: '1.00'
          TEMPO_NA: '1.15'
          TTS_TEMPERATURE: '0.50'
          XDG_CACHE_HOME: '/home/runner/.cache'
          HF_HOME: '/home/runner/.cache/huggingface'
        run: |
          set -e
          python3 - <<'EOF'
          import os
          import re
          import sys
          import math
          import html
          import subprocess
          import requests
          from pydub import AudioSegment, effects
          from faster_whisper import WhisperModel
          from mutagen.id3 import ID3, TIT2, TALB, APIC, ID3NoHeaderError

          NAAM = os.environ.get("OUTPUT_NAAM", "stationname")
          INTRO = os.environ.get("INTRO", "").strip()
          OUTRO = os.environ.get("OUTRO", "").strip()
          WHISPER_MODEL = os.environ.get("WHISPER_MODEL", "small")
          SPEAKER_FILE = os.environ.get("SPEAKER_FILE", "stem_voorbeeld.mp3")
          BED_FILE = os.environ.get("BED_FILE", "newsbed-1.mp3")

          def exit_with(msg, code=1):
              print(msg)
              sys.exit(code)

          # =====================  TEKST NORMALISEREN (cijfers als woorden)  =====================
          _EN = ["nul", "een", "twee", "drie", "vier", "vijf", "zes", "zeven", "acht", "negen",
                 "tien", "elf", "twaalf", "dertien", "veertien", "vijftien", "zestien",
                 "zeventien", "achttien", "negentien"]
          _TIEN = {2: "twintig", 3: "dertig", 4: "veertig", 5: "vijftig",
                   6: "zestig", 7: "zeventig", 8: "tachtig", 9: "negentig"}

          def num_nl(n):
              n = int(n)
              if n < 20:
                  return _EN[n]
              if n < 100:
                  t, e = divmod(n, 10)
                  if e == 0:
                      return _TIEN[t]
                  eenheid = _EN[e]
                  return eenheid + ("ën" if eenheid.endswith("e") else "en") + _TIEN[t]
              if n < 1000:
                  h, rest = divmod(n, 100)
                  kop = "honderd" if h == 1 else _EN[h] + "honderd"
                  return kop + (num_nl(rest) if rest else "")
              if n < 1000000:
                  d, rest = divmod(n, 1000)
                  kop = "duizend" if d == 1 else num_nl(d) + "duizend"
                  return kop + (" " + num_nl(rest) if rest else "")
              return str(n)

          # afkortingen letter voor letter laten uitspreken (SGP -> es gee pee, ANP -> aa en pee)
          LETTERNAMEN = {"A": "aa", "B": "bee", "C": "see", "D": "dee", "E": "ee", "F": "ef", "G": "gee",
                         "H": "haa", "I": "ie", "J": "jee", "K": "kaa", "L": "el", "M": "em", "N": "en",
                         "O": "oo", "P": "pee", "Q": "kuu", "R": "er", "S": "es", "T": "tee", "U": "uu",
                         "V": "vee", "W": "wee", "X": "iks", "Y": "ei", "Z": "zet"}
          # afkortingen die als gewoon woord klinken: NIET spellen (aanvullen waar nodig)
          ALS_WOORD = {"NAVO", "NATO", "FIFA", "UEFA", "OPEC", "NASA", "NOS", "AMRO", "COVID", "ISIS", "TUI"}

          def _spel(m):
              w = m.group(0)
              return w if w in ALS_WOORD else " ".join(LETTERNAMEN[c] for c in w)

          def normalize_for_tts(t):
              t = html.unescape(html.unescape(t))
              t = re.sub(r"<[^>]+>", " ", t)
              t = t.replace(" ", " ")
              t = re.sub(r"\bD66\b", "dee zesenzestig", t)
              t = re.sub(r"\b(?:[A-Z]\.){2,}", lambda m: m.group(0).replace(".", ""), t)   # A.N.P. -> ANP
              t = re.sub(r"\b[A-Z]{2,6}\b", _spel, t)                                       # ANP -> aa en pee
              t = re.sub(r"[ \t]*\n[ \t]*", " ", t)
              t = re.sub(r"(\d)\.(\d{3})(?!\d)", r"\1\2", t)          # 1.200 -> 1200
              t = re.sub(r"(\d)\.(\d{3})(?!\d)", r"\1\2", t)
              t = re.sub(r"€\s*(\d[\d,]*)", r"\1 euro", t)       # EUR 5 -> 5 euro
              t = re.sub(r"\s*°(?:\s*C\b)?", " graden", t)
              t = re.sub(r"(^|\W)[-–−](\d)", r"\1min \2", t)
              t = re.sub(r"(\d),(\d)", r"\1 komma \2", t)
              t = re.sub(r"\s*%", " procent", t)
              t = re.sub(r"(?i)\bkm\s*/\s*(?:u|h)\b", "kilometer per uur", t)
              t = re.sub(r"(?i)\bt/m\b", "tot en met", t)
              t = re.sub(r"(?i)\bca\.", "circa", t)
              t = re.sub(r"(?<!\d)\d{1,6}(?!\d)", lambda m: num_nl(m.group(0)), t)
              t = re.sub(r"[ \t]{2,}", " ", t)
              return t.strip()

          # =====================  TEKST IN STUKKEN KNIPPEN  =====================
          def maak_stukken(tekst, max_len=160):
              def knip(z):
                  if len(z) <= max_len:
                      return [z]
                  uit, cur = [], ""
                  for d in re.split(r"(?<=[,;:])\s+", z):
                      if cur and len(cur) + 1 + len(d) > max_len:
                          uit.append(cur)
                          cur = d
                      else:
                          cur = (cur + " " + d).strip()
                  if cur:
                      uit.append(cur)
                  res = []
                  for u in uit:
                      while len(u) > max_len:
                          i = u.rfind(" ", 0, max_len)
                          i = i if i > 0 else max_len
                          res.append(u[:i])
                          u = u[i:].strip()
                      if u:
                          res.append(u)
                  return res

              stukken, huidig = [], ""
              for z in re.split(r"(?<=[.!?])\s+", tekst.strip()):
                  for p in knip(z):
                      if huidig and len(huidig) + 1 + len(p) > max_len:
                          stukken.append(huidig)
                          huidig = p
                      else:
                          huidig = (huidig + " " + p).strip()
              if huidig:
                  stukken.append(huidig)
              return [s if s.endswith((".", "!", "?")) else s + "." for s in stukken]

          if os.environ.get("ALLEEN_FUNCTIES") == "1":
              sys.exit(0)

          # =====================  CPML TOS + SAFE GLOBALS  =====================
          from TTS.utils.manage import ModelManager
          def _skip_tos(self, output_path):
              print("CPML TOS automatisch overgeslagen (CI).")
              return True
          ModelManager.ask_tos = _skip_tos

          import torch
          from TTS.tts.configs.xtts_config import XttsConfig
          from TTS.tts.models.xtts import XttsAudioConfig, XttsArgs
          from TTS.config.shared_configs import BaseDatasetConfig
          torch.serialization.add_safe_globals([XttsConfig, XttsAudioConfig, XttsArgs, BaseDatasetConfig])

          # =====================  AUDIO OPHALEN (uit de check-stap)  =====================
          audio_url = open("nieuw-audio-url.tmp", encoding="utf-8").read().strip()
          resp = requests.get(audio_url, timeout=120)
          resp.raise_for_status()
          with open("temp.mp3", "wb") as f:
              f.write(resp.content)

          audio = AudioSegment.from_file("temp.mp3")
          trimmed = audio[5400:len(audio) - int(5.9 * 1000)]
          faded = trimmed.fade_in(1000).fade_out(1000)
          effects.normalize(faded).export("processed.mp3", format="mp3", bitrate="128k")

          # =====================  WHISPER  =====================
          whisper = WhisperModel(WHISPER_MODEL, device="cpu", compute_type="int8")
          segments, _ = whisper.transcribe("processed.mp3", language="nl", beam_size=3,
                                           temperature=0, vad_filter=True,
                                           condition_on_previous_text=False)   # voorkomt rare herhalingen/dooreenhaspelen
          raw_lines = [seg.text.strip() for seg in segments if seg.text.strip()]
          body = " ".join(" ".join(raw_lines).split())
          if not body:
              exit_with("Transcriptie is leeg - workflow stopt netjes.", 0)

          # voor controle in de log: zo komt de tekst uit Whisper
          print("RUWE TEKST begin:", body[:250])
          print("RUWE TEKST einde:", body[-250:])

          # --- BEGIN: de openingszin(nen) van de presentator eraf ("Goeiemiddag, ik ben ...") ---
          def is_intro(z):
              woorden = re.findall(r"[A-Za-z\u00c0-\u00ff'-]+", z)
              if re.search(r"(?i)\bik ben\b", z):
                  return True                                             # "... ik ben Piet Puk."
              if re.match(r"(?i)(goe\w*|hallo|hoi|welkom)\b", z) and len(woorden) <= 12:
                  return True                                             # alleen een groet
              if 0 < len(woorden) <= 4 and all(w[0].isupper() for w in woorden):
                  return True                                             # losse naam: "Piet Puk."
              return False

          zinnen = re.split(r"(?<=[.!?])\s+", body)
          weg = 0
          while zinnen and weg < 3 and is_intro(zinnen[0]):
              print("Openingszin verwijderd:", zinnen[0])
              zinnen.pop(0)
              weg += 1
          body = " ".join(zinnen)

          # --- EINDE: alles vanaf "Dit was het ANP nieuws" eraf (ook 'A.N.P.', 'A nep', 'ANP') ---
          einde = [m for m in re.finditer(r"(?i)\bdit was (?:het )?.{0,30}?nieuws\b", body)
                   if m.start() > len(body) * 0.5]
          if einde:
              print("Slotzin van de bron weggehaald:", body[einde[-1].start():][:120])
              body = body[:einde[-1].start()].strip()
          else:
              print("Waarschuwing: 'Dit was het ... nieuws' niet gevonden; tekst niet afgekapt.")

          if not body:
              exit_with("Tekst is leeg na opschonen - workflow stopt netjes.", 0)
          if not body.endswith((".", "!", "?")):
              body += "."

          transcript = " ".join(x for x in [INTRO, body, OUTRO] if x)
          with open(f"{NAAM}.txt", "w", encoding="utf-8") as f:
              f.write(transcript)

          tts_tekst = " ".join(x for x in [normalize_for_tts(INTRO), normalize_for_tts(body), normalize_for_tts(OUTRO)] if x)
          stukken = maak_stukken(tts_tekst)
          print(f"{len(stukken)} stukken om uit te spreken")

          # =====================  XTTS  =====================
          from TTS.api import TTS
          tts = TTS("tts_models/multilingual/multi-dataset/xtts_v2")

          max_ms = int(float(os.environ.get("SPEAKER_MAX_SECONDS", "30")) * 1000)
          speaker = AudioSegment.from_file(SPEAKER_FILE)[:max_ms]
          speaker = effects.normalize(speaker).low_pass_filter(9000).high_pass_filter(100)
          speaker.export("clean_speaker.wav", format="wav")

          try:
              speed = float(os.environ.get("XTTS_SPEED", "1.00"))
          except Exception:
              speed = 1.00
          try:
              temperatuur = float(os.environ.get("TTS_TEMPERATURE", "0.50"))
          except Exception:
              temperatuur = 0.50

          def spreek(tekst, pad):
              try:
                  tts.tts_to_file(text=tekst, speaker_wav="clean_speaker.wav", language="nl",
                                  file_path=pad, speed=speed, temperature=temperatuur,
                                  split_sentences=False)
              except TypeError:
                  tts.tts_to_file(text=tekst, speaker_wav="clean_speaker.wav", language="nl",
                                  file_path=pad, speed=speed)

          voice = AudioSegment.empty()
          pauze = AudioSegment.silent(duration=250)
          for i, stuk in enumerate(stukken):
              pad = f"stuk-{i}.wav"
              spreek(stuk, pad)
              voice += AudioSegment.from_file(pad) + pauze
          voice.export("raw.wav", format="wav")

          # versnellen met ffmpeg (toonhoogte blijft gelijk)
          try:
              tempo_na = float(os.environ.get("TEMPO_NA", "1.15"))
          except Exception:
              tempo_na = 1.15
          bron = "raw.wav"
          if abs(tempo_na - 1.0) > 0.01:
              res = subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-i", "raw.wav",
                                    "-filter:a", f"atempo={tempo_na}", "snel.wav"],
                                   capture_output=True, text=True)
              if res.returncode == 0 and os.path.exists("snel.wav"):
                  bron = "snel.wav"
              else:
                  print("Waarschuwing: versnellen mislukt:", res.stderr)
          voice = effects.normalize(AudioSegment.from_file(bron))

          # =====================  BED + MP3 + ID3  =====================
          final = voice
          if os.path.exists(BED_FILE):
              bed = AudioSegment.from_file(BED_FILE) - 23
              if len(bed) < len(voice) and len(bed) > 0:
                  bed *= math.ceil(len(voice) / len(bed))
              final = bed[:len(voice)].overlay(voice)
          final.export(f"{NAAM}.mp3", format="mp3", bitrate="128k")

          try:
              id3 = ID3(f"{NAAM}.mp3")
          except ID3NoHeaderError:
              id3 = ID3()
          id3.add(TIT2(encoding=3, text="Chazzo Nieuws Update"))
          id3.add(TALB(encoding=3, text="Chazzo Nieuws Update"))
          cover = os.environ.get("COVER_IMAGE", "stationname.jpg")
          if os.path.exists(cover):
              with open(cover, "rb") as img:
                  id3.add(APIC(encoding=3, mime="image/jpeg", type=3, desc="Cover", data=img.read()))
          id3.save(f"{NAAM}.mp3")

          # pas nu onthouden welke aflevering klaar is
          os.replace("nieuw-id.tmp", "nieuws-laatste-id.txt")
          print(f"Klaar: {NAAM}.mp3 en {NAAM}.txt aangemaakt.")
          EOF

      - name: Commit and push changes
        if: steps.check.outputs.nieuw == 'true'
        run: |
          set -e
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add stationname.mp3 stationname.txt nieuws-laatste-id.txt

          if git diff --cached --quiet; then
            echo "Geen wijzigingen om te committen."
            exit 0
          fi

          git commit -m "FAST Update: Chazzo Nieuws Update - $(TZ=Europe/Amsterdam date '+%H:%M')"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
